name: Build Micropython
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"
env:
  TARGET: esp32s3
  IDF_TARGET: esp32s3
jobs:
  Build-Firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Python3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libusb-1.0-0-dev cmake
      - name: Add python deps
        run: pip install pillow
      - name: Check out driver code
        uses: actions/checkout@v2
        with:
          submodules: true
      - name: Check out ESP IDF
        uses: actions/checkout@v2
        with:
          repository: espressif/esp-idf
          ref: v4.4.1
          path: esp-idf
          submodules: true
      - name: Install SDK
        run: |
          cd esp-idf
          ./install.sh
          source export.sh
          python3 -m pip install pillow
      - name: Patch submodule dependencies
        run: |
          ./scripts/firstTime.sh
      - name: Build cross compiler
        run: |
          source esp-idf/export.sh
          cd micropython
          make -C mpy-cross
      - name: Link board definition
        run: |
          source esp-idf/export.sh
          cd micropython/ports/esp32/boards
          ln -sfn ../../../../tildamk6 ./tildamk6
      - name: Build firmware
        run: |
          source esp-idf/export.sh
          ln -sfn $GITHUB_WORKSPACE/tildamk6 micropython/ports/esp32/boards/tildamk6
          cd micropython/ports/esp32
          make submodules BOARD=tildamk6 USER_C_MODULES=$GITHUB_WORKSPACE/drivers/micropython.cmake USER_COMPONENTS=$GITHUB_WORKSPACE/components/tinyusb IOT_SOLUTION_PATH=$GITHUB_WORKSPACE/esp-iot-solution TARGET=esp32s3
          make BOARD=tildamk6 USER_C_MODULES=$GITHUB_WORKSPACE/drivers/micropython.cmake USER_COMPONENTS=$GITHUB_WORKSPACE/components/tinyusb $@ IOT_SOLUTION_PATH=$GITHUB_WORKSPACE/esp-iot-solution TARGET=esp32s3
          cd ../../..
          echo "{\"build\":\"$(git describe --tags --always)\", \"name\":\"$(git describe --tags --always)\"}" > micropython/ports/esp32/build-tildamk6/tidal.txt
      - name: Archive firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            micropython/ports/esp32/build-tildamk6/micropython.bin
            micropython/ports/esp32/build-tildamk6/bootloader/bootloader.bin
            micropython/ports/esp32/build-tildamk6/partition_table/partition-table.bin
            micropython/ports/esp32/build-tildamk6/ota_data_initial.bin
            micropython/ports/esp32/build-tildamk6/tidal.txt
      - name: Create latest release for tags
        uses: "marvinpinto/action-automatic-releases@latest"
        if: github.event_name == 'push'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: "Latest release build"
          files: |
            micropython/ports/esp32/build-tildamk6/micropython.bin
            micropython/ports/esp32/build-tildamk6/tidal.txt
      - name: Create specific release for tags
        uses: "marvinpinto/action-automatic-releases@latest"
        if: github.event_name == 'push'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          files: |
            micropython/ports/esp32/build-tildamk6/micropython.bin
            micropython/ports/esp32/build-tildamk6/tidal.txt
      - name: Build merged image
        run: |
          source esp-idf/export.sh
          cd micropython/ports/esp32
          python $IDF_PATH/components/esptool_py/esptool/esptool.py --chip esp32s3 -b 460800 merge_bin -o merged-firmware.bin --flash_mode dio --flash_freq 80m --flash_size 8MB 0x0 build-tildamk6/bootloader/bootloader.bin 0x10000 build-tildamk6/micropython.bin 0x8000 build-tildamk6/partition_table/partition-table.bin 0xd000 build-tildamk6/ota_data_initial.bin
          cp merged-firmware.bin $GITHUB_WORKSPACE/flasher/
        if: startsWith(github.event.ref, 'refs/tags/v')
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: ./flasher
        if: ${{startsWith(github.event.ref, 'refs/tags/v') && !contains(github.event.ref, '-') }}
  deploy:
    if: ${{startsWith(github.event.ref, 'refs/tags/v') && !contains(github.event.ref, '-') }}
    needs: Build-Firmware

    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action